name: Build geosite.dat

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build.yml"
      - "cmd/**"
      - "config/**"
      - "go.mod"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v7
        with:
          path: self

      - name: Checkout v2fly/domain-list-community (latest)
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Record upstream commit
        id: upstream
        run: echo "sha=$(git -C community rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: community/go.mod
          cache-dependency-path: community/go.sum

      - name: Export base lists (flattened and deduplicated by upstream)
        run: |
          cd community
          go run ./ --outputdir=../base --outputname=base.dat \
            --exportlists=cn,geolocation-!cn,category-ads-all

      - name: Merge external sources into the data directory
        run: |
          cd self
          go run ./cmd/merge \
            --community ../community \
            --base ../base \
            --config ./config/sources.json \
            --report ../publish/build-info.json \
            --upstream-sha "${{ steps.upstream.outputs.sha }}"

      - name: Build geosite.dat
        run: |
          cd community
          go run ./ --outputdir=../publish --outputname=geosite.dat

      - name: Health checks
        run: |
          cd self
          go run ./cmd/verify \
            --dat ../publish/geosite.dat \
            --basedat ../base/base.dat \
            --report ../publish/verify.json

      - name: Generate sha256
        run: |
          cd publish
          sha256sum geosite.dat > geosite.dat.sha256sum
          cat geosite.dat.sha256sum

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(date -u +%Y%m%d%H%M%S)
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Upstream v2fly/domain-list-community commit: ${{ steps.upstream.outputs.sha }}" \
            --latest \
            ./publish/geosite.dat \
            ./publish/geosite.dat.sha256sum \
            ./publish/build-info.json \
            ./publish/verify.json

      - name: Prune old releases and tags (keep latest 5)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          prune() {
            set -euo pipefail

            # 只保留最近 5 个时间戳 tag（14 位数字，字典序即时间序）
            old_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
              --jq '.[].name' \
              | { grep -E '^[0-9]{14}$' || true; } \
              | sort -r \
              | tail -n +6)

            if [ -z "$old_tags" ]; then
              echo "No old tags to prune."
              return 0
            fi

            for tag in $old_tags; do
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "Deleting release and tag: $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              else
                echo "Deleting orphan tag: $tag"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              fi
            done
          }

          if ! prune; then
            echo "::warning::Failed to prune old releases; the new release is already published."
          fi
